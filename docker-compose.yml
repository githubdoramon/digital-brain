services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memdb
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  orchestrator:
    image: appcalipse/digital-brain-orchestrator
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
    container_name: mem-orchestrator
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  # removed_service:
  #   build:
  #     context: ./backend/removed_service
  #     dockerfile: Dockerfile
  #   container_name: mem-removed-service
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - ./backend/.env
  #   ports:
  #     - "7001:7001"
  #   volumes:
  #     - ./backend/removed_service/models:/app/models
  #     - ./backend/removed_service/dataset:/app/dataset

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: mem-frontend
    depends_on:
      orchestrator:
        condition: service_started
    env_file:
      - ./frontend/web/.env
    ports:
      - "3000:3000"

volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
