services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memdb
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memuser -d memdb"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  orchestrator:
    image: digital-brain
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: mem-orchestrator
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DB_DSN: postgresql://memuser:mempass@db:5432/memdb
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: mem-frontend
    depends_on:
      orchestrator:
        condition: service_started
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web:/app
      - /app/node_modules

volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
