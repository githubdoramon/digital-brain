version: 2
# Open automatic PRs only for known security vulnerabilities.
# Plan routine dependency upgrades as occasional maintenance batches.
updates:
  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Defer breaking web toolchain upgrades until a coordinated migration.
      # Hold Next.js at the current major and patch line until a coordinated upgrade.
      - dependency-name: next
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"


  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Keep React Native and React aligned with the current Expo SDK.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      # Defer Expo-sensitive native package minors until a planned SDK migration.
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
      - dependency-name: react-test-renderer
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-maps
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-reanimated
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-screens
