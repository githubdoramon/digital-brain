version: 2
# Open automatic PRs only for known security vulnerabilities.
# Plan routine dependency upgrades as occasional maintenance batches.
updates:
  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Keep Next.js security updates on the current major until a coordinated migration.
      - dependency-name: next
        versions: [">=16.0.0"]
      # Defer routine breaking web toolchain upgrades until a coordinated migration.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Hold Expo Router on the current Expo SDK until a coordinated migration.
      - dependency-name: expo-router
      # Keep React Native and React aligned with the current Expo SDK.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      # Defer Expo-sensitive native package minors until a planned SDK migration.
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
      - dependency-name: react-test-renderer
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-maps
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-reanimated
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-screens
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-svg
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-worklets
        update-types:
          - version-update:semver-minor
      - dependency-name: whisper.rn
        update-types:
          - version-update:semver-minor
      - dependency-name: "@siteed/audio-studio"
        update-types:
          - version-update:semver-minor
      # Defer native integration majors until a coordinated migration.
      - dependency-name: react-native-webview
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-native-google-signin/google-signin"
        update-types:
          - version-update:semver-major
      # Defer major lint and TypeScript changes until a planned toolchain migration.
      - dependency-name: eslint-config-prettier
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-import-resolver-typescript
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Async Storage 3 changes APIs and Android installation.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types:
          - version-update:semver-major
      # Expo SDK module majors are coordinated as an SDK migration.
      - dependency-name: "expo*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
    groups:
      mobile-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend/orchestrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      orchestrator-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend/robot-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      robot-gateway-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Stay on the supported Node 24 LTS line.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      frontend-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend/orchestrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      orchestrator-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend/robot-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      robot-gateway-docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
