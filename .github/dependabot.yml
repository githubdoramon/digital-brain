version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    ignore:
      # Defer breaking web toolchain upgrades until we plan a coordinated migration.
      - dependency-name: next
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # Keep React Native and React aligned with the current Expo SDK.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      # Defer major lint and TypeScript changes until a planned toolchain migration.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Expo SDK module majors are coordinated as an SDK migration.
      - dependency-name: "expo*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
    groups:
      mobile-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend/orchestrator
    schedule:
      interval: weekly
    groups:
      orchestrator-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend/robot-gateway
    schedule:
      interval: weekly
    groups:
      robot-gateway-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend/web
    schedule:
      interval: weekly
    ignore:
      # Stay on the supported Node 24 LTS line; revisit Node 26 with app validation.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /backend/orchestrator
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend/robot-gateway
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
