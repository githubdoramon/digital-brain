version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/web
    schedule:
      interval: weekly
    ignore:
      # Defer breaking web toolchain upgrades until we plan a coordinated migration.
      - dependency-name: next
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      frontend-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # Keep React Native and React aligned with the current Expo SDK.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      # Defer Expo-sensitive native package minors until a planned SDK migration.
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
      - dependency-name: react-test-renderer
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-maps
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-reanimated
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-screens
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-svg
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native-worklets
        update-types:
          - version-update:semver-minor
      - dependency-name: whisper.rn
        update-types:
          - version-update:semver-minor
      - dependency-name: "@siteed/audio-studio"
        update-types:
          - version-update:semver-minor
      # Defer native integration majors until a coordinated migration.
      - dependency-name: react-native-webview
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-native-google-signin/google-signin"
        update-types:
          - version-update:semver-major
      # Defer major lint and TypeScript changes until a planned toolchain migration.
      - dependency-name: eslint-config-prettier
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-import-resolver-typescript
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Async Storage 3 changes APIs and Android installation.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types:
          - version-update:semver-major
      # Expo SDK module majors are coordinated as an SDK migration.
      - dependency-name: "expo*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
    groups:
      mobile-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend/orchestrator
    schedule:
      interval: weekly
    groups:
      orchestrator-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend/robot-gateway
    schedule:
      interval: weekly
    groups:
      robot-gateway-non-security:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend/web
    schedule:
      interval: weekly
    ignore:
      # Stay on the supported Node 24 LTS line; revisit Node 26 with app validation.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /backend/orchestrator
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend/robot-gateway
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
