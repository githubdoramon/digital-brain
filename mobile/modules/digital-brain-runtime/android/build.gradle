plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.digitalbrainruntime'
version = '0.1.0'

android {
  namespace "expo.modules.digitalbrainruntime"
  defaultConfig {
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  maven { url = uri(new File(project(':mentra-bluetooth-sdk').projectDir, 'libs/maven')) }
}

dependencies {
  implementation 'com.k2fsa.sherpa.onnx:sherpa-onnx:1.13.2@aar'
  implementation project(':mentra-bluetooth-sdk')
  implementation project(':whisper.rn')
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'androidx.documentfile:documentfile:1.0.1'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  // WorkManager exposes ListenableFuture; keep its API on this module's compile classpath.
  implementation 'com.google.guava:guava:33.4.8-android'
  testImplementation 'junit:junit:4.13.2'
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
